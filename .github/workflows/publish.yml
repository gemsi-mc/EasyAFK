name: Publish

# Publishes the built jars to Modrinth, CurseForge and a GitHub Release.
# Triggered by pushing a version tag, e.g.  git tag 2.3.0 && git push origin 2.3.0
#
# The release notes come from CHANGELOG.md: the section headed "## [<version>]" is
# extracted and used verbatim on all three platforms. Write that section before
# tagging, or the run fails at the "Extract changelog" step below.
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   Secrets:
#     MODRINTH_TOKEN        - Modrinth PAT with "Create versions" scope
#     CURSEFORGE_TOKEN      - CurseForge API token (from https://legacy.curseforge.com/account/api-tokens)
#   Variables:
#     MODRINTH_PROJECT_ID   - Modrinth project id or slug (e.g. easyafk)
#     CURSEFORGE_PROJECT_ID - CurseForge numeric project id (shown on the project page)

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write   # needed to create the GitHub Release

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        id: version
        run: echo "version=$(grep '^version=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches gradle.properties version
        run: |
          TAG="$GITHUB_REF_NAME"
          PROP="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$PROP" ]; then
            echo "::error::Tag $TAG does not match gradle.properties version $PROP"
            exit 1
          fi

      # Runs before the build so a missing changelog fails in seconds, not minutes.
      - name: Extract changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Everything between this version's heading and the next heading or link
          # footer, with surrounding blank lines trimmed.
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac > CHANGELOG_CURRENT.md
          if [ ! -s CHANGELOG_CURRENT.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section (or the section is empty)"
            exit 1
          fi
          echo "Release notes for $VERSION:"
          cat CHANGELOG_CURRENT.md

      - name: Build
        run: ./gradlew build --no-daemon

      # ---- Fabric ----
      - name: Publish Fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
          changelog-file: CHANGELOG_CURRENT.md
          name: EasyAFK ${{ steps.version.outputs.version }} (Fabric/Quilt)
          version: ${{ steps.version.outputs.version }}
          version-type: release
          loaders: |
            fabric
            quilt
          game-versions: '1.21.1'
          dependencies: |
            fabric-api(required)
          java: '21'
          retry-attempts: 3

      # ---- NeoForge ----
      - name: Publish NeoForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
          changelog-file: CHANGELOG_CURRENT.md
          name: EasyAFK ${{ steps.version.outputs.version }} (NeoForge)
          version: ${{ steps.version.outputs.version }}
          version-type: release
          loaders: neoforge
          game-versions: '1.21.1'
          java: '21'
          retry-attempts: 3

      # ---- Forge ----
      - name: Publish Forge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: forge/build/libs/!(*-@(dev|sources|javadoc)).jar
          changelog-file: CHANGELOG_CURRENT.md
          name: EasyAFK ${{ steps.version.outputs.version }} (Forge)
          version: ${{ steps.version.outputs.version }}
          version-type: release
          loaders: forge
          game-versions: '1.21.1'
          java: '21'
          retry-attempts: 3

      # ---- GitHub Release (all three jars) ----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EasyAFK ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          # GitHub appends the auto-generated PR list beneath the changelog body.
          body_path: CHANGELOG_CURRENT.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
            neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
            forge/build/libs/!(*-@(dev|sources|javadoc)).jar
